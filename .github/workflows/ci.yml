# ─────────────────────────────────────────────────────────────────────────────
#  ci.yml — replaces api.yml, pr-checks.yml, docker-compose-check.yml.
#
#  Design: cheap jobs (lint, unit tests, config validation) run on every push
#  and PR, unconditionally — they're fast enough that path-filtering them
#  isn't worth the risk of a filter bug silently skipping a check. Only the
#  expensive multi-arch image build is gated on whether API-relevant paths
#  actually changed, via dorny/paths-filter.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Cheap checks: always run ────────────────────────────────────────────
  lint-and-typecheck:
    name: API — lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate
      - name: Type check
        working-directory: api
        run: npx tsc --noEmit

  unit-tests:
    name: Unit tests (API, dashboard, producer)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.2-alpine   # pinned to match docker-compose.yml
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: API unit tests
        working-directory: api
        run: npm test
      - name: Dashboard unit tests
        # Zero-dependency by design (see dashboard/server.js's own header) —
        # runs directly under Node's built-in test runner, no npm ci needed.
        # NOTE: `node --test <dir>` fails to discover tests on this Node
        # version (misparses the directory as a module to require) — bare
        # `node --test` with cwd set to the directory is what actually works;
        # verified directly before relying on it here.
        working-directory: dashboard
        run: node --test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install producer dependencies
        working-directory: producer
        run: pip install -r requirements.txt
      - name: Producer unit tests
        working-directory: producer
        env:
          REDIS_URL: redis://localhost:6379
        run: python3 -m unittest discover -s test -v

  validate-configs:
    name: Validate infrastructure configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml

      - name: docker-compose.yml
        run: docker compose config --quiet && echo "docker-compose.yml OK"

      - name: kong/kong.yml (real parser, not just YAML syntax)
        run: |
          docker run --rm -v "$PWD/kong/kong.yml:/kong.yml:ro" \
            -e "KONG_DATABASE=off" -e "KONG_DECLARATIVE_CONFIG=/kong.yml" \
            kong:3.9.3-ubuntu kong config parse /kong.yml

      - name: prometheus/prometheus.yml (real parser)
        run: |
          docker run --rm -v "$PWD/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            --entrypoint promtool prom/prometheus:v3.13.3 \
            check config /etc/prometheus/prometheus.yml

      - name: grafana provisioning (datasources + dashboards)
        run: |
          python3 -c "
          import yaml
          for f in ['grafana/provisioning/datasources/prometheus.yml',
                    'grafana/provisioning/datasources/tempo.yml',
                    'grafana/provisioning/dashboards/default.yml']:
              d = yaml.safe_load(open(f))
              assert d, f'{f} is empty or invalid'
              print(f'{f} OK')
          "

      - name: shellcheck every script
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y shellcheck
          find . -name '*.sh' -not -path './node_modules/*' -print0 \
            | xargs -0 shellcheck -S warning

  # ── PR-time build: catches a broken Dockerfile before merge ─────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions: block REPLACES the workflow-level one for
      # that job, it does not merge — contents: read must be repeated here
      # or actions/checkout itself fails ("Repository not found", GitHub's
      # deliberate ambiguous error for missing repo access).
      contents: read
      pull-requests: read   # dorny/paths-filter needs this to query changed files via the API
    outputs:
      api: ${{ steps.filter.outputs.api }}
      producer: ${{ steps.filter.outputs.producer }}
      agent: ${{ steps.filter.outputs.agent }}
      spark: ${{ steps.filter.outputs.spark }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            producer:
              - 'producer/**'
            agent:
              - 'agent/**'
            spark:
              - 'spark/**'

  build-pr:
    name: Build changed Dockerfiles (no push)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.producer == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.spark == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build api (no push)
        if: needs.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          platforms: linux/arm64,linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build producer (no push)
        if: needs.changes.outputs.producer == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./producer
          file: ./producer/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build agent (no push)
        if: needs.changes.outputs.agent == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build spark (no push)
        if: needs.changes.outputs.spark == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./spark
          file: ./spark/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── main-only: build, push, and update the K8s manifest to match ────────
  build-and-push:
    name: API — build, push, tag GitOps manifest
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true'

    permissions:
      contents: write   # needed to commit the new image tag back to k8s/
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        # GHCR requires a lowercase path; github.repository preserves the
        # owner's actual casing, so this only matters for a fork with
        # uppercase letters in its username — cheap insurance either way.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | sed 's#/adlab-lab$#/adlab-api#')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64,linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image Built" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ steps.image.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Record the new image tag in k8s/ (GitOps — what ArgoCD actually syncs)
        id: sha
        run: echo "short=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Update kustomization.yaml and commit
        working-directory: k8s
        run: |
          kustomize edit set image "${{ steps.image.outputs.name }}=${{ steps.image.outputs.name }}:${{ steps.sha.outputs.short }}"
          cd ..
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "No change to k8s/kustomization.yaml — image tag already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "k8s: bump adlab-api image to ${{ steps.sha.outputs.short }} [skip ci]"
          # [skip ci] avoids this commit re-triggering this same workflow.
          # Not strictly required — ci.yml has no path filter on k8s/, and a
          # GITHUB_TOKEN-authored push doesn't re-trigger push events anyway
          # — but it stays as a clear, load-bearing signal of intent in the
          # commit log if either of those facts ever changes.
          git push

  # ── Real correctness gate: brings up core+streaming and runs the actual
  # end-to-end checks, not just "does it build". Every CI job above this one
  # can go green on a change that compiles fine and still breaks the running
  # pipeline — this is the one that would have caught that directly, the
  # same way it caught real regressions throughout this project's history.
  integration:
    name: Integration test (smoke + e2e)
    runs-on: ubuntu-latest
    needs: changes
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.api == 'true' || needs.changes.outputs.producer == 'true' || needs.changes.outputs.spark == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Elasticsearch needs a higher vm.max_map_count than this runner's default
        # Confirmed directly: every real project running Elasticsearch in
        # GitHub Actions sets this explicitly first — the runner's own
        # default isn't high enough, the same limit that broke a real
        # Linux machine earlier in this project's own history.
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start core + streaming
        run: ./start.sh streaming --no-dashboard

      # e2e.sh already runs bin/smoke.sh itself as its first step, and
      # reports a smoke failure clearly on its own — a standalone step here
      # was pure duplication. Worse: back-to-back with no gap between the
      # two invocations, both using $(date +%s) for a "unique" email, this
      # is exactly what caused run #66 to fail (two smoke.sh runs within
      # the same second collided on the same generated email). Fixed at the
      # source in smoke.sh too (see bin/smoke.sh), but removing the
      # redundant call here removes the actual trigger.
      - name: End-to-end test
        run: bin/e2e.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile streaming --profile tools logs --tail=200

      - name: Tear down
        if: always()
        run: ./stop.sh
