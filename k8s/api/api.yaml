apiVersion: apps/v1
kind: Deployment
metadata:
  name: adlab-api
  namespace: adlab
  labels:
    app: adlab-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adlab-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: adlab-api
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path:   "/metrics"
        prometheus.io/port:   "3000"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-redis
          image: busybox
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"]
        - name: wait-for-elasticsearch
          image: busybox
          command: ["sh", "-c", "until nc -z elasticsearch 9200; do echo waiting for es; sleep 2; done"]
        - name: run-migrations
          image: ghcr.io/brunooffs/adlab-api:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              value: "postgresql://lab:labpass@postgres:5432/adlab"

      containers:
        - name: adlab-api
          image: ghcr.io/brunooffs/adlab-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            # ── Direct values — no substitution needed ──────────────────────
            - name: DATABASE_URL
              value: "postgresql://lab:labpass@postgres:5432/adlab"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: ES_URL
              value: "http://elasticsearch:9200"
            - name: MONGO_URL
              value: "mongodb://lab:labpass@mongodb:27017/adlab?authSource=admin"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: OTEL_SERVICE_NAME
              value: "adlab-api"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo:4318"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=256"
            # ── Secrets ────────────────────────────────────────────────────
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: adlab-secrets
                  key: JWT_SECRET

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: adlab-api
  namespace: adlab
  labels:
    app: adlab-api
spec:
  selector:
    app: adlab-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adlab-api-hpa
  namespace: adlab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adlab-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
