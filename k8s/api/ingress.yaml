# ─────────────────────────────────────────────────────────────────────────────
#  ingress.yaml — Expose the API via minikube ingress
#  Enable with: minikube addons enable ingress
#  Access at:   http://adlab.local (add to /etc/hosts)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adlab-ingress
  namespace: adlab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/rate-limit: "120"        # match Kong rate limit
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: adlab.local
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: adlab-api
                port:
                  number: 3000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: adlab-api
                port:
                  number: 3000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: adlab-api
                port:
                  number: 3000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: adlab-api
                port:
                  number: 3000
