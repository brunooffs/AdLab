# ─────────────────────────────────────────────────────────────────────────────
#  secrets.yaml — Sensitive configuration
#  Values are base64 encoded: echo -n "value" | base64
#
#  In production: use External Secrets Operator or Sealed Secrets
#  to avoid storing secrets in git. For the lab these are safe to commit.
#
#  lab/labpass → bGFi / bGFicGFzcw==
#  admin/admin → YWRtaW4= / YWRtaW4=
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: adlab-secrets
  namespace: adlab
type: Opaque
data:
  # PostgreSQL — lab:labpass
  POSTGRES_USER:     bGFi
  POSTGRES_PASSWORD: bGFicGFzcw==

  # MongoDB — lab:labpass
  MONGO_USERNAME: bGFi
  MONGO_PASSWORD: bGFicGFzcw==

  # JWT secret — dev-secret-change-in-production
  JWT_SECRET: ZGV2LXNlY3JldC1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==

  # Grafana — admin:admin
  GRAFANA_ADMIN_USER:     YWRtaW4=
  GRAFANA_ADMIN_PASSWORD: YWRtaW4=
