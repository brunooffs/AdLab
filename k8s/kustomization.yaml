# ─────────────────────────────────────────────────────────────────────────────
#  kustomization.yaml — root kustomize config
#  ArgoCD uses this to discover and apply all manifests
#  kubectl apply -k k8s/   applies everything in order
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: adlab

  # Foundation

  # Data layer — order matters (API depends on these)

  # Application layer
resources:
- base/namespace.yaml
- base/configmap.yaml
- base/secrets.yaml
- postgres/postgres.yaml
- redis/redis.yaml
- elasticsearch/elasticsearch.yaml
- api/api.yaml
# api/ingress.yaml removed: minikube's ingress addon depends on
# ingress-nginx, which Kubernetes retired (no further releases, bug fixes,
# or security patches). Use `kubectl port-forward` for local access — see
# k8s/README.md — or bring your own Ingress/Gateway API setup if you need one.
images:
- name: ghcr.io/brunooffs/adlab-api
  newName: ghcr.io/brunooffs/adlab-api
  newTag: sha-651d3ce
