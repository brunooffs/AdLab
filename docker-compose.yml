# ─────────────────────────────────────────────────────────────────────────────
#  AdLab — M1 32GB optimised
#  Docker Desktop memory limit: 16GB recommended
#  Total target: ~10GB RAM — gives all services room to breathe
# ─────────────────────────────────────────────────────────────────────────────

name: adlab

# Profiles — start only what you need (see ./start.sh):
#   (none)         core: postgres, redis, mongodb, elasticsearch, migrate, api
#   gateway        kong
#   streaming      kafka, kafka-ui, spark-master, spark-worker
#   analytics      kibana
#   observability  prometheus, grafana, tempo
#   extras         cassandra, keycloak   (not wired into the pipeline yet)
#   tools          producer (one-shot; run it with ./produce.sh)

services:

  # ── Kafka (KRaft) ──────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    profiles: ["streaming"]
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ── Kafka UI ───────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xmx256m"
    networks:
      - pipeline

  # ── Elasticsearch ──────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"       # 1GB heap — solid for lab
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - pipeline
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 40s

  # ── Kibana ─────────────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    profiles: ["analytics"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      xpack.security.enabled: "false"
      NODE_OPTIONS: "--max-old-space-size=1024"   # 1GB Node heap
    networks:
      - pipeline

  # ── Spark Master ───────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    profiles: ["streaming"]
    command: >
      /bin/bash -c "/opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/*"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8081
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./spark-jobs:/opt/spark-apps
      - spark_logs:/opt/spark/logs
    networks:
      - pipeline
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 | grep -q 'Spark Master'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Spark Worker ───────────────────────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.3
    container_name: spark-worker
    profiles: ["streaming"]
    command: >
      /bin/bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    environment:
      SPARK_WORKER_CORES: 2              # 2 cores
      SPARK_WORKER_MEMORY: 2g            # 2GB worker memory
      SPARK_WORKER_WEBUI_PORT: 8082
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: 512m
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./spark-jobs:/opt/spark-apps
      - spark_logs:/opt/spark/logs
    networks:
      - pipeline

  # ── Cassandra ──────────────────────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    profiles: ["extras"]
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "local-cluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - pipeline
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q 'UN'"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: adlab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - pipeline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d adlab"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: lab
      MONGO_INITDB_ROOT_PASSWORD: labpass
      MONGO_INITDB_DATABASE: adlab
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pipeline
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kong API Gateway ───────────────────────────────────────────────────────
  kong:
    image: kong:3.7-ubuntu
    container_name: kong
    profiles: ["gateway"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_PLUGINS: bundled
      KONG_NGINX_WORKER_PROCESSES: 2
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Node.js API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: adlab-api:local
    container_name: api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://lab:labpass@postgres:5432/adlab
      MONGO_URL: mongodb://lab:labpass@mongodb:27017/adlab?authSource=admin
      REDIS_URL: redis://redis:6379
      ES_URL: http://elasticsearch:9200
      NODE_OPTIONS: "--max-old-space-size=512"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_SERVICE_NAME: adlab-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - pipeline

  # ── DB migrations (one-shot; api starts only after this succeeds) ──────────
  migrate:
    image: adlab-migrate:local   # own tag: two services must not build to the same image name
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://lab:labpass@postgres:5432/adlab
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pipeline

  # ── Click event producer (one-shot; run it with ./produce.sh) ──────────────
  producer:
    build: ./producer
    profiles: ["tools"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://lab:labpass@postgres:5432/adlab
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - pipeline

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - pipeline

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - pipeline


  # ── Grafana Tempo — distributed tracing ───────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.0
    container_name: tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "127.0.0.1:3200:3200"    # Tempo HTTP API + UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"    # OTLP HTTP receiver (Node.js sends here)
    networks:
      - pipeline

  # ── Keycloak ───────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    profiles: ["extras"]
    restart: "no"
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: lab
      KC_DB_PASSWORD: labpass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pipeline

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  kafka_data:
  es_data:
  spark_logs:
  cassandra_data:
  postgres_data:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
  tempo_data:

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  pipeline:
    driver: bridge
