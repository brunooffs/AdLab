<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdLab</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e8ee; --muted: #8b93a7;
    --up: #34d399; --starting: #fbbf24; --stopped: #4b5263; --bad: #f87171; --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  header { padding: 20px 24px 8px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; }
  main { padding: 16px 24px 40px; max-width: 1000px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .bar label { display: flex; align-items: center; gap: 5px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 12.5px; user-select: none; }
  .bar label:has(input:checked) { border-color: var(--accent); color: var(--accent); }
  .bar input { accent-color: var(--accent); }
  button { font: inherit; border: 1px solid var(--line); background: #1e2230; color: var(--text); padding: 7px 14px; border-radius: 7px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
  button.danger { background: #3a1414; border-color: var(--bad); color: #ffb4b4; }
  .spacer { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .card .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--stopped); }
  .dot.up { background: var(--up); box-shadow: 0 0 6px var(--up); }
  .dot.starting { background: var(--starting); }
  .dot.unhealthy, .dot.exited { background: var(--bad); }
  .card .label { font-weight: 600; }
  .card .state { color: var(--muted); font-size: 12px; }
  .card a { color: var(--accent); font-size: 12px; text-decoration: none; }
  .card a:hover { text-decoration: underline; }
  .group-title { margin: 22px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #logWrap { display: none; margin-top: 18px; }
  #logWrap.show { display: block; }
  #logHead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  #logTitle { font-weight: 600; }
  #log { background: #05070a; border: 1px solid var(--line); border-radius: 8px; padding: 12px; height: 320px; overflow: auto; white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, monospace; }
  #dockerWarn { display: none; margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #3a1414; border: 1px solid var(--bad); color: #ffb4b4; font-size: 12.5px; }
  #dockerWarn.show { display: block; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 360px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 4px; }
  .tabs button { background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 4px; color: var(--muted); }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .tabpanel { display: none; }
  .tabpanel.active { display: block; }
  .expcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; max-width: 480px; }
  .expcard h3 { margin: 0 0 4px; font-size: 15px; }
  .expcard .desc { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; background: #0d1017; border: 1px solid var(--line); border-radius: 6px; color: var(--text); padding: 7px 9px; font: inherit; }
  .field input:invalid { border-color: var(--bad); }
  .fieldErr { color: var(--bad); font-size: 11.5px; margin-top: 3px; min-height: 14px; }
  .sparkbar { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
  .sparkbar .sparklabel { font-weight: 600; }
  .sparkbar .sparkstate { color: var(--muted); font-size: 12.5px; }
  .sparkbar .spacer { flex: 1; }
  .sparklog { background: #05070a; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: -4px 0 16px; max-height: 110px; overflow: auto; font: 11.5px ui-monospace, Menlo, monospace; color: var(--muted); display: none; }
  .sparklog.show { display: block; }
  .expwarn { background: #3a2d14; border: 1px solid #7a5a1a; color: #ffd98a; border-radius: 6px; padding: 7px 10px; font-size: 12px; margin-bottom: 12px; display: none; }
  .expwarn.show { display: block; }
  .tutlayout { display: flex; gap: 20px; align-items: flex-start; }
  #tutNav { flex: 0 0 250px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 16px; }
  #tutNav button { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 7px 10px; color: var(--muted); font-size: 12.5px; }
  #tutNav button.current { background: var(--panel); border-color: var(--line); color: var(--text); }
  #tutNav button:disabled { color: #4b5263; cursor: default; }
  #tutNav button .num { color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 6px; }
  #tutNav .locked-note { font-size: 10.5px; color: #4b5263; margin-left: 26px; }
  #tutContent { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px 28px; max-width: 720px; }
  #tutContent h1 { font-size: 21px; margin-top: 0; }
  #tutContent h2 { font-size: 16px; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 18px; }
  #tutContent h3 { font-size: 14px; color: var(--accent); }
  #tutContent p { line-height: 1.65; color: #cbd0db; }
  #tutContent a { color: var(--accent); }
  #tutContent code { background: #0d1017; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font: 12.5px ui-monospace, Menlo, monospace; }
  #tutContent pre { background: #05070a; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  #tutContent pre code { background: none; border: none; padding: 0; }
  #tutContent pre.mermaid-src { position: relative; }
  #tutContent pre.mermaid-src::before { content: "diagram source (rendered on GitHub)"; display: block; font: 11px sans-serif; color: var(--muted); margin-bottom: 6px; }
  #tutContent blockquote { margin: 14px 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
  #tutContent ul { padding-left: 22px; line-height: 1.7; color: #cbd0db; }
  #tutContent table { border-collapse: collapse; margin: 12px 0; }
  #tutContent th, #tutContent td { border: 1px solid var(--line); padding: 5px 10px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>AdLab</h1>
  <div class="sub">local control panel — drives the same start.sh / stop.sh / reset.sh you'd run by hand</div>
</header>
<main>
  <div id="dockerWarn"></div>

  <div class="tabs">
    <button class="active" data-tab="infra">Infrastructure</button>
    <button data-tab="experiments">Experiments</button>
    <button data-tab="tutorial">Tutorials</button>
  </div>

  <div id="tab-infra" class="tabpanel active">
    <div class="bar" id="profileBar">
      <span class="sub" style="margin-right:4px;">Start:</span>
      <label><input type="checkbox" value="gateway"> gateway</label>
      <label><input type="checkbox" value="streaming"> streaming</label>
      <label><input type="checkbox" value="analytics"> analytics</label>
      <label><input type="checkbox" value="observability"> observability</label>
      <label><input type="checkbox" value="extras"> extras</label>
      <button class="primary" id="btnStart">Start selected</button>
      <div class="spacer"></div>
      <button id="btnStop">Stop</button>
      <button class="danger" id="btnReset">Reset (wipes data)</button>
    </div>

    <div id="groups"></div>

    <div class="sparkbar" id="argocdBar" style="margin-top:16px;">
      <span class="dot" id="argoDot"></span>
      <span class="sparklabel">Kubernetes / ArgoCD</span>
      <span class="sparkstate" id="argoState">checking…</span>
      <div class="spacer"></div>
      <span class="sparkstate" id="argoContext"></span>
    </div>
  </div>

  <div id="tab-experiments" class="tabpanel">
    <div class="sparkbar">
      <span class="dot" id="sparkDot"></span>
      <span class="sparklabel">Spark streaming job</span>
      <span class="sparkstate" id="sparkState">checking…</span>
      <div class="spacer"></div>
      <button id="btnSparkStart">Start Spark</button>
      <button id="btnSparkStop" disabled>Stop Spark</button>
    </div>
    <div class="sparklog" id="sparkLog"></div>
    <div id="experiments"></div>
  </div>

  <div id="tab-tutorial" class="tabpanel">
    <div class="tutlayout">
      <nav id="tutNav"></nav>
      <article id="tutContent"><p class="sub">Loading…</p></article>
    </div>
  </div>

  <div id="logWrap">
    <div id="logHead"><span id="logTitle"></span><span class="sub" id="logStatus"></span></div>
    <div id="log"></div>
  </div>
</main>

<script>
'use strict';
const PROFILE_ORDER = [
  [null, 'Core (always on)'],
  ['gateway', 'Gateway'],
  ['streaming', 'Streaming'],
  ['analytics', 'Analytics'],
  ['observability', 'Observability'],
  ['extras', 'Extras'],
];
const STATE_LABEL = { up: 'up', starting: 'starting…', stopped: 'not started', exited: 'exited', unhealthy: 'unhealthy' };

const groupsEl = document.getElementById('groups');
const dockerWarnEl = document.getElementById('dockerWarn');

function render(status) {
  dockerWarnEl.classList.toggle('show', !status.dockerOk);
  if (!status.dockerOk) dockerWarnEl.textContent = 'Could not reach Docker: ' + (status.dockerError || 'unknown error') + ' — is Docker running?';

  const byProfile = new Map();
  for (const svc of status.services) {
    const key = svc.profile;
    if (!byProfile.has(key)) byProfile.set(key, []);
    byProfile.get(key).push(svc);
  }

  groupsEl.innerHTML = '';
  for (const [key, title] of PROFILE_ORDER) {
    const list = byProfile.get(key) || [];
    if (!list.length) continue;
    const h = document.createElement('div');
    h.className = 'group-title';
    h.textContent = title;
    groupsEl.appendChild(h);

    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const svc of list) {
      const card = document.createElement('div');
      card.className = 'card';
      const link = svc.url && svc.state === 'up' ? `<a href="${svc.url}" target="_blank" rel="noopener">${svc.url.replace(/^https?:\/\//, '')}</a>` : '';
      card.innerHTML = `
        <div class="row"><span class="dot ${svc.state}"></span><span class="label">${svc.label}</span></div>
        <div class="state">${STATE_LABEL[svc.state] || svc.state}</div>
        ${link}
      `;
      grid.appendChild(card);
    }
    groupsEl.appendChild(grid);
  }
}

async function refresh() {
  try {
    const r = await fetch('/api/status');
    const status = await r.json();
    render(status);
    setButtonsBusy(!!(status.run && status.run.running));
    if (status.run && status.run.running && !currentLogRun) attachLog(status.run.id, status.run.label);
  } catch (e) { /* server likely restarting between polls; ignore and retry */ }
}

function setButtonsBusy(busy) {
  for (const id of ['btnStart', 'btnStop', 'btnReset']) document.getElementById(id).disabled = busy;
  document.querySelectorAll('[data-run]').forEach((b) => (b.disabled = busy));
}

let currentLogRun = null;
let es = null;

function attachLog(runId, label) {
  currentLogRun = runId;
  const wrap = document.getElementById('logWrap');
  const logEl = document.getElementById('log');
  document.getElementById('logTitle').textContent = label;
  document.getElementById('logStatus').textContent = 'running…';
  logEl.textContent = '';
  wrap.classList.add('show');
  if (es) es.close();
  es = new EventSource('/api/logs?run=' + encodeURIComponent(runId));
  es.addEventListener('line', (ev) => {
    logEl.textContent += ev.data.replace(/\\n/g, '\n');
    logEl.scrollTop = logEl.scrollHeight;
  });
  es.addEventListener('done', (ev) => {
    const { code } = JSON.parse(ev.data);
    document.getElementById('logStatus').textContent = code === 0 ? 'finished' : `exited with code ${code}`;
    es.close(); es = null; currentLogRun = null;
    setButtonsBusy(false);
    refresh();
  });
  es.onerror = () => { /* connection dropped; the next refresh() poll will re-attach if still running */ };
}

async function postAction(payload) {
  const r = await fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { alert(data.error || ('request failed: ' + r.status)); return; }
  setButtonsBusy(true);
  attachLog(data.runId, payload.action === 'start' ? 'start.sh' : payload.action + '.sh');
}

// ── Tabs ─────────────────────────────────────────────────────────────────
for (const btn of document.querySelectorAll('.tabs button')) {
  btn.addEventListener('click', () => {
    for (const b of document.querySelectorAll('.tabs button')) b.classList.toggle('active', b === btn);
    for (const p of document.querySelectorAll('.tabpanel')) p.classList.toggle('active', p.id === 'tab-' + btn.dataset.tab);
  });
}

// ── Experiments: form is rendered from the server's own schema, not hardcoded ─
async function loadExperiments() {
  const r = await fetch('/api/experiments');
  const { experiments } = await r.json();
  const root = document.getElementById('experiments');
  root.innerHTML = '';
  for (const exp of experiments) {
    const card = document.createElement('div');
    card.className = 'expcard';
    const fieldsHtml = exp.params.map((p) => {
      const errId = `err-${exp.id}-${p.name}`;
      if (p.type === 'number') {
        return `<div class="field"><label>${p.label}</label>
          <input data-param="${p.name}" type="number" value="${p.default}"
                 ${p.min !== undefined ? `min="${p.min}"` : ''} ${p.max !== undefined ? `max="${p.max}"` : ''} ${p.step !== undefined ? `step="${p.step}"` : ''}>
          <div class="fieldErr" id="${errId}"></div></div>`;
      }
      if (p.type === 'text') {
        return `<div class="field"><label>${p.label}</label>
          <input data-param="${p.name}" type="text" value="${p.default}" ${p.pattern ? `pattern="${p.pattern}"` : ''}>
          <div class="fieldErr" id="${errId}"></div></div>`;
      }
      if (p.type === 'boolean') {
        return `<div class="field"><label style="display:flex; align-items:center; gap:7px;">
          <input data-param="${p.name}" type="checkbox" style="width:auto;" ${p.default ? 'checked' : ''}>
          ${p.label}</label>
          <div class="fieldErr" id="${errId}"></div></div>`;
      }
      return '';
    }).join('');
    const needsSpark = exp.requiresProfiles && exp.requiresProfiles.includes('streaming');
    card.innerHTML = `
      <h3>${exp.label}</h3>
      <div class="desc">${exp.description}${exp.requiresProfiles && exp.requiresProfiles.length ? ` Needs: ${exp.requiresProfiles.join(', ')} running.` : ''}</div>
      ${needsSpark ? `<div class="expwarn" id="expwarn-${exp.id}">⚠ Checking Spark status…</div>` : ''}
      ${fieldsHtml}
      <button class="primary" data-run="${exp.id}">Run</button>
    `;
    root.appendChild(card);
  }
  root.querySelectorAll('[data-run]').forEach((btn) => {
    btn.addEventListener('click', () => runExperiment(btn.dataset.run, btn.closest('.expcard')));
  });
}

async function runExperiment(id, cardEl) {
  cardEl.querySelectorAll('.fieldErr').forEach((e) => (e.textContent = ''));
  const params = {};
  cardEl.querySelectorAll('[data-param]').forEach((input) => {
    if (input.type === 'checkbox') params[input.dataset.param] = input.checked;
    else if (input.type === 'number') params[input.dataset.param] = Number(input.value);
    else params[input.dataset.param] = input.value;
  });
  const r = await fetch('/api/experiment', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, params }),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { alert(data.error || ('request failed: ' + r.status)); return; }
  setButtonsBusy(true);
  attachLog(data.runId, id);
}

loadExperiments();

// ── Spark control — independent of the experiments/infra run lock, since
// Spark is meant to keep running while other things happen, not block them.
let sparkLogRunId = null;
let sparkEs = null;

function setExpWarnings(status) {
  const msg = !status.reachable
    ? '⚠ Spark isn\'t running yet — start the streaming profile first (Kafka + Spark), then use "Start Spark" above.'
    : '⚠ Spark is not running — events will queue in Kafka until you start it (button above).';
  document.querySelectorAll('[id^="expwarn-"]').forEach((el) => {
    el.classList.toggle('show', !status.running);
    el.textContent = msg;
  });
}

async function refreshSparkStatus() {
  let status;
  try { status = await (await fetch('/api/spark/status')).json(); }
  catch { return; }
  const dot = document.getElementById('sparkDot');
  const stateEl = document.getElementById('sparkState');
  const startBtn = document.getElementById('btnSparkStart');
  const stopBtn = document.getElementById('btnSparkStop');
  if (!status.reachable) {
    dot.className = 'dot';
    stateEl.textContent = 'spark-master unreachable — start the streaming profile first';
    startBtn.disabled = true; stopBtn.disabled = true;
  } else if (status.running) {
    dot.className = 'dot up';
    stateEl.textContent = `running (${status.appId || 'unknown app'})`;
    startBtn.disabled = true; stopBtn.disabled = false;
  } else {
    dot.className = 'dot';
    stateEl.textContent = 'not running';
    startBtn.disabled = false; stopBtn.disabled = true;
  }
  setExpWarnings(status);
}

function attachSparkLog(runId) {
  sparkLogRunId = runId;
  const wrap = document.getElementById('sparkLog');
  const logEl = wrap;
  wrap.classList.add('show');
  logEl.textContent = '';
  if (sparkEs) sparkEs.close();
  sparkEs = new EventSource('/api/spark/logs?run=' + encodeURIComponent(runId));
  sparkEs.addEventListener('line', (ev) => {
    logEl.textContent += ev.data.replace(/\\n/g, '\n');
    logEl.scrollTop = logEl.scrollHeight;
  });
  sparkEs.addEventListener('done', () => { sparkEs.close(); sparkEs = null; sparkLogRunId = null; refreshSparkStatus(); });
  sparkEs.onerror = () => { /* dropped connection; next status poll reflects reality regardless */ };
}

document.getElementById('btnSparkStart').addEventListener('click', async () => {
  const r = await fetch('/api/spark/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { alert(data.error || ('request failed: ' + r.status)); return; }
  attachSparkLog(data.runId);
  refreshSparkStatus();
});

document.getElementById('btnSparkStop').addEventListener('click', async () => {
  const r = await fetch('/api/spark/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { alert(data.error || ('request failed: ' + r.status)); return; }
  refreshSparkStatus();
});

refreshSparkStatus();
setInterval(refreshSparkStatus, 3000);

// ── ArgoCD status — read-only, optional, external to this repo's own
// automation. Polled far less often than Spark: each check means two real
// kubectl subprocess calls (slower, heavier than an HTTP fetch), and ArgoCD's
// own sync cycle runs on the order of minutes anyway — no value in checking
// every 3s.
async function refreshArgoStatus() {
  let status;
  try { status = await (await fetch('/api/argocd/status')).json(); }
  catch { return; }
  const dot = document.getElementById('argoDot');
  const stateEl = document.getElementById('argoState');
  const ctxEl = document.getElementById('argoContext');
  if (!status.available) {
    dot.className = 'dot';
    stateEl.textContent = 'not configured (' + status.reason + ')';
    ctxEl.textContent = '';
  } else if (!status.appFound) {
    dot.className = 'dot';
    stateEl.textContent = 'no adlab Application found';
    ctxEl.textContent = 'context: ' + status.context;
  } else {
    const healthy = status.sync === 'Synced' && status.health === 'Healthy';
    dot.className = healthy ? 'dot up' : 'dot';
    stateEl.textContent = `${status.sync} / ${status.health}` + (status.revision ? ` (${status.revision})` : '');
    ctxEl.textContent = 'context: ' + status.context;
  }
}
refreshArgoStatus();
setInterval(refreshArgoStatus, 20000);

// ── Tutorials ────────────────────────────────────────────────────────────
// Minimal Markdown-subset renderer — deliberately not a general parser.
// Handles: headers, bold/italic, inline code, fenced code blocks (mermaid
// fences render as labeled source, since a real diagram renderer would break
// the zero-dependency constraint), links, unordered lists, blockquotes,
// paragraphs. Anything fancier (tables in source, nested lists) will render
// literally rather than break — chapters are written knowing this.
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderInline(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function renderMarkdown(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let html = '';
  let i = 0;
  let inList = false;
  let para = [];              // buffered lines of the paragraph/list-item in progress
  const flushPara = () => {
    if (para.length) { html += `<p>${renderInline(para.join(' '))}</p>`; para = []; }
  };
  const closeList = () => { flushListItem(); if (inList) { html += '</ul>'; inList = false; } };
  let listItem = [];          // buffered lines of the current <li>, across continuation lines
  const flushListItem = () => {
    if (listItem.length) { html += `<li>${renderInline(listItem.join(' '))}</li>`; listItem = []; }
  };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^```(\w*)/);
    if (fence) {
      flushPara(); closeList();
      const lang = fence[1];
      const body = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) { body.push(lines[i]); i++; }
      i++; // skip closing fence
      const cls = lang === 'mermaid' ? ' class="mermaid-src"' : '';
      html += `<pre${cls}><code>${escapeHtml(body.join('\n'))}</code></pre>`;
      continue;
    }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { flushPara(); closeList(); html += `<h${h[1].length}>${renderInline(h[2])}</h${h[1].length}>`; i++; continue; }
    const li = line.match(/^[-*]\s+(.*)/);
    if (li) {
      flushPara();
      if (!inList) { html += '<ul>'; inList = true; } else { flushListItem(); }
      listItem.push(li[1]);
      i++; continue;
    }
    // A continuation line: indented (or just non-blank) text right after a list
    // item, with no bullet of its own — CommonMark treats this as part of the
    // same item. Only applies while we're inside a list.
    if (inList && listItem.length && line.trim() !== '' && !line.match(/^>\s?/)) {
      listItem.push(line.trim());
      i++; continue;
    }
    const bq = line.match(/^>\s?(.*)/);
    if (bq) { flushPara(); closeList(); html += `<blockquote>${renderInline(bq[1])}</blockquote>`; i++; continue; }
    if (line.trim() === '') { flushPara(); closeList(); i++; continue; }
    closeList();
    para.push(line.trim());
    i++;
  }
  flushPara(); closeList();
  return html;
}

let tutChapters = [];
let tutCurrent = null;

async function loadTutorialNav() {
  const r = await fetch('/api/tutorials');
  const { chapters } = await r.json();
  tutChapters = chapters;
  const nav = document.getElementById('tutNav');
  nav.innerHTML = '';
  for (const c of chapters) {
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="num">${c.id}</span>${c.title}`;
    if (!c.available) {
      btn.disabled = true;
      btn.title = c.blockedOn ? `Coming after: ${c.blockedOn}` : 'Coming soon';
    } else {
      btn.addEventListener('click', () => openChapter(c.id));
    }
    nav.appendChild(btn);
    if (!c.available && c.blockedOn) {
      const note = document.createElement('div');
      note.className = 'locked-note';
      note.textContent = `after ${c.blockedOn}`;
      nav.appendChild(note);
    }
  }
  if (chapters.some((c) => c.available)) openChapter(chapters.find((c) => c.available).id);
}

async function openChapter(id) {
  tutCurrent = id;
  document.querySelectorAll('#tutNav button').forEach((b, idx) => b.classList.toggle('current', tutChapters[idx] && tutChapters[idx].id === id));
  const content = document.getElementById('tutContent');
  content.innerHTML = '<p class="sub">Loading…</p>';
  const r = await fetch('/api/tutorials/chapter?id=' + encodeURIComponent(id));
  if (!r.ok) { content.innerHTML = '<p class="sub">This chapter is not written yet.</p>'; return; }
  const md = await r.text();
  content.innerHTML = renderMarkdown(md);
}

loadTutorialNav();

document.getElementById('btnStart').addEventListener('click', () => {
  const profiles = [...document.querySelectorAll('#profileBar input:checked')].map((i) => i.value);
  postAction({ action: 'start', profiles });
});
document.getElementById('btnStop').addEventListener('click', () => postAction({ action: 'stop' }));
document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('This deletes ALL AdLab data (Postgres, Elasticsearch, Kafka, everything). Continue?')) return;
  postAction({ action: 'reset', confirm: 'RESET' });
});

refresh();
setInterval(refresh, 3000);
</script>
